name: NEXORA Android Debug APK CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build & Test NEXORA Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.10.2 with Caching
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Run Python FastAPI Backend & SQL Migration Unit Tests
        run: |
          python3 -m unittest discover -s backend/tests -v

      - name: Run Unit Tests & Assemble Debug APK
        env:
          NEXORA_BACKEND_BASE_URL: ${{ vars.NEXORA_BACKEND_BASE_URL || 'https://api.nexora.example.com/' }}
        run: |
          gradle testDebugUnitTest assembleDebug --stacktrace --no-daemon

      - name: Verify Generated APK Exists
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Debug APK was not generated at $APK_PATH"
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload NEXORA Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
